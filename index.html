<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Books - Premium Portal</title>
<style>
:root {
--tg-dark-bg: #17212b;
--laser-blue: #00f0ff;
--laser-glow: rgba(0, 240, 255, 0.45);
--btn-blue: #2481cc;
--btn-shadow: rgba(11, 44, 71, 0.95);
--card-radius: 35px;
--transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
body {
background-color: var(--tg-dark-bg);
color: #ffffff;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
min-height: 100vh;
padding: 160px 24px 120px 24px; /* افزایش هوشمند فاصله پایین برای قرارگیری بنر ثابت بدون پوشاندن دکمه‌ها */
position: relative;
overflow-x: hidden;
-webkit-font-smoothing: antialiased;
}
.telegram-btn {
position: fixed;
top: 30px;
left: 50%;
transform: translateX(-50%);
z-index: 10000;
background: linear-gradient(135deg, #00f0ff, #0066ff);
color: #ffffff;
text-decoration: none;
padding: 13px 38px;
border-radius: 20px;
font-size: 15px;
font-weight: 700;
display: flex;
align-items: center;
justify-content: center;
gap: 12px;
border: 1px solid rgba(255, 255, 255, 0.25);
box-shadow: 0 8px 25px var(--laser-glow), inset 0 1px 2px rgba(255, 255, 255, 0.4);
transition: var(--transition-smooth);
white-space: nowrap;
}
.telegram-btn:hover {
transform: translateX(-50%) translateY(-3px);
box-shadow: 0 12px 35px rgba(0, 240, 255, 0.7);
filter: brightness(1.1);
}
.telegram-icon {
width: 22px;
height: 22px;
fill: #ffffff;
transition: var(--transition-smooth);
}
.telegram-btn:hover .telegram-icon {
transform: scale(1.1);
}
.main-title {
font-size: 3rem;
font-weight: 900;
text-align: center;
margin-bottom: 70px;
line-height: 1.2;
letter-spacing: -1px;
background: linear-gradient(180deg, #ffffff 0%, #b0c4de 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}
.cards-container {
display: grid;
grid-template-columns: repeat(3, minmax(260px, 340px));
gap: 50px;
width: 100%;
max-width: 1200px;
justify-content: center;
}
.card-wrapper {
display: flex;
flex-direction: column;
align-items: center;
width: 100%;
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.06);
padding: 22px;
border-radius: calc(var(--card-radius) + 10px);
box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
transition: var(--transition-smooth);
}
.card-wrapper:hover {
transform: translateY(-8px);
background: rgba(255, 255, 255, 0.05);
border-color: rgba(255, 255, 255, 0.12);
box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
}
.card-img-box {
width: 100%;
aspect-ratio: 1 / 1;
background-color: #ffffff;
border-radius: var(--card-radius);
padding: 20px;
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 22px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
transition: var(--transition-smooth);
}
.card-img {
max-width: 100%;
max-height: 100%;
object-fit: contain;
transition: var(--transition-smooth);
}
.card-wrapper:hover .card-img {
transform: scale(1.05);
}
.card-btn {
width: 100%;
background-color: var(--btn-blue);
color: #ffffff;
text-decoration: none;
text-align: center;
padding: 14px 20px;
border-radius: 16px;
font-size: 15px;
font-weight: 600;
box-shadow: 0 10px 22px var(--btn-shadow);
border: 1px solid rgba(255, 255, 255, 0.08);
transition: var(--transition-smooth);
}
.card-btn:hover {
background-color: #2b96eb;
box-shadow: 0 12px 28px rgba(36, 129, 204, 0.5);
transform: translateY(-1px);
}
.attribution {
display: none;
}

/* 🔴 SYSTEM BANNER CONTAINER STYLE */
#floating-ad-container {
position: fixed;
bottom: 0;
left: 50%;
transform: translateX(-50%);
width: 100%;
display: flex;
justify-content: center;
align-items: center;
z-index: 999999;
background: transparent;
pointer-events: auto;
}

@media (max-width: 950px) {
.cards-container {
grid-template-columns: repeat(2, minmax(240px, 320px));
gap: 40px;
}
.main-title {
font-size: 2.5rem;
}
}
@media (max-width: 600px) {
body {
padding-top: 130px;
padding-left: 12px;
padding-right: 12px;
padding-bottom: 80px;
}
.main-title {
font-size: 1.8rem;
margin-bottom: 45px;
}
.cards-container {
grid-template-columns: repeat(2, 1fr);
gap: 12px;
}
.card-wrapper {
padding: 10px;
border-radius: 25px;
}
.card-img-box {
border-radius: 20px;
padding: 10px;
margin-bottom: 12px;
}
.card-btn {
font-size: 11px;
padding: 11px 4px;
border-radius: 12px;
box-shadow: 0 6px 14px var(--btn-shadow);
}
.telegram-btn {
padding: 11px 24px;
font-size: 13px;
top: 20px;
border-radius: 14px;
box-shadow: 0 6px 18px var(--laser-glow);
}
}
</style>
</head>

<div id="floating-ad-container"></div>

<!-- RESPONSIVE AUTO-SIZE ADS SYSTEM SCRIPT -->
<script>
(function() {
    var container = document.getElementById("floating-ad-container");

    function loadAd() {
        container.innerHTML = "";
        var w = window.innerWidth;
        var key = "";
        var width = 0;
        var height = 0;

        if (w < 600) {
            // MOBILE AD START
            key = "3b8048b78e2b0fb0b882483f96fca8a2";
            width = 320;
            height = 50;
            // MOBILE AD END
        } else if (w >= 600 && w <= 1024) {
            // TABLET AD START
            key = "27bf67bdd07dd3734a6fdff8c7879c99";
            width = 468;
            height = 60;
            // TABLET AD END
        } else {
            // DESKTOP AD START
            key = "30c18b6ace1c2676949453fd6ac33776";
            width = 728;
            height = 90;
            // DESKTOP AD END
        }

        window.atOptions = {
            'key': key,
            'format': 'iframe',
            'height': height,
            'width': width,
            'params': {}
        };

        var s = document.createElement("script");
        s.src = "https://speedingdeadlyplays.com/" + key + "/invoke.js";
        s.async = true;
        container.appendChild(s);
    }

    loadAd();
    setInterval(loadAd, 8000);
})();
</script>
